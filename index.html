<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>High Camp — Hollis Mountain</title>
  <meta name="description" content="High Camp — a career-intelligence guide built on Rob McKinney's full professional background. Share a role; get an honest read on the fit."/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M2 23 L8 11 L12 17 L17 6 L24 23 Z' stroke='%232d6a4f' stroke-width='1.6' fill='none' stroke-linejoin='round'/><path d='M17 6 L17 2 L22 3.5 L17 5 Z' fill='%232d6a4f' stroke='%232d6a4f' stroke-width='1' stroke-linejoin='round'/></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Spline+Sans+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#ffffff; --ink-2:#f4f4f2; --paper:#fafaf9; --paper-2:#e8e8e4;
      --summit:#0f1614; --slate:#8a9088; --slate-2:#3d4a44;
      --pine:#1a4030; --copper:#2d6a4f; --copper-glow:rgba(45,106,79,.14);
      --line:rgba(45,106,79,.14);
      --display:'Spectral',Georgia,serif;
      --sans:'Archivo','Helvetica Neue',sans-serif;
      --mono:'Spline Sans Mono',monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      background:var(--ink);color:var(--summit);font-family:var(--sans);line-height:1.6;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
      height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    }
    ::selection{background:var(--copper);color:var(--ink)}
    a{color:inherit}

    /* ===== NAV ===== */
    nav{
      flex:none;display:flex;align-items:center;justify-content:space-between;
      padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;
    }
    .nav-left{display:flex;align-items:center;gap:16px}
    .hm{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--summit)}
    .hm .wm{font-family:var(--display);font-weight:600;font-size:1.02rem;letter-spacing:.01em}
    .nav-div{width:1px;height:26px;background:var(--line)}
    .hc-ctx{display:flex;align-items:center;gap:9px}
    .hc-ctx .nm{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--copper)}
    .nav-right{display:flex;align-items:center;gap:20px}
    .back{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-2);text-decoration:none;transition:color .2s}
    .back:hover{color:var(--summit)}
    @media(max-width:600px){
      nav{padding:14px 18px}
      .hm .wm{display:none}
      .nav-right .back-long{display:none}
    }
    @media(max-width:380px){
      .nav-right .back{font-size:0}
      .nav-right .back::before{content:"\2190";font-size:.95rem;color:var(--slate-2)}
    }

    /* ===== THREAD ===== */
    .thread{flex:1;overflow-y:auto;position:relative}
    .thread-inner{max-width:780px;margin:0 auto;padding:48px 28px 24px}
    .ridge{position:fixed;left:0;right:0;bottom:78px;height:200px;z-index:0;opacity:.4;pointer-events:none}

    .msg{display:flex;gap:14px;margin-bottom:30px;position:relative;z-index:1;transition:transform .42s cubic-bezier(.2,.7,.2,1)}
    .msg.enter{transform:translateY(10px)}
    @media(prefers-reduced-motion:reduce){.msg{transition:none}.msg.enter{transform:none}}

    .avatar{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .avatar.hc{background:var(--pine)}
    .avatar.me{background:var(--ink-2);border:1px solid var(--line)}
    .avatar.me span{font-family:var(--mono);font-size:.62rem;letter-spacing:.04em;color:var(--slate-2)}

    .bubble{flex:1;min-width:0}
    .who{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-2);margin-bottom:8px}
    .msg.user{flex-direction:row-reverse}
    .msg.user .bubble{display:flex;justify-content:flex-end}
    .msg.user .utext{
      background:var(--ink-2);border:1px solid var(--line);border-radius:3px;
      padding:13px 17px;font-size:.98rem;color:var(--summit);max-width:80%;
      line-height:1.55;white-space:pre-wrap;word-wrap:break-word;
    }
    .atext{font-size:1.02rem;color:var(--slate-2);line-height:1.62}
    .atext strong{color:var(--summit);font-weight:600}
    .atext em{font-style:italic}
    .atext p{margin-bottom:13px}
    .atext p:last-child{margin-bottom:0}
    .atext ul, .atext ol{list-style:none;padding-left:0;margin:10px 0}
    .atext li{position:relative;padding-left:18px;margin-bottom:6px}
    .atext li::before{content:"\2013";position:absolute;left:0;color:var(--copper);font-weight:500}
    .atext a{color:var(--copper);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--copper-glow)}

    /* suggestion chips */
    .suggest{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    .schip{
      font-family:var(--sans);font-size:.86rem;color:var(--slate-2);
      background:var(--ink);border:1px solid var(--line);border-radius:999px;
      padding:9px 16px;cursor:pointer;transition:border-color .2s,color .2s;line-height:1.3;
    }
    .schip:hover{border-color:var(--copper);color:var(--copper)}

    /* typing indicator */
    .typing{display:inline-flex;gap:5px;align-items:center;padding:6px 0}
    .typing i{width:7px;height:7px;border-radius:50%;background:var(--copper);opacity:.4;animation:blink 1.2s infinite}
    .typing i:nth-child(2){animation-delay:.2s}
    .typing i:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
    @media(prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}

    /* ===== COMPOSER ===== */
    .composer-wrap{flex:none;border-top:1px solid var(--line);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10}
    .composer{max-width:780px;margin:0 auto;padding:16px 28px 10px}
    .composer form{
      display:flex;align-items:flex-end;gap:12px;
      border:1px solid var(--line);border-radius:4px;padding:8px 8px 8px 16px;
      background:var(--ink);transition:border-color .2s,box-shadow .2s;
    }
    .composer form:focus-within{border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-glow)}
    .composer textarea{
      flex:1;border:none;outline:none;resize:none;
      font-family:var(--sans);font-size:1rem;color:var(--summit);
      line-height:1.5;background:transparent;max-height:160px;padding:7px 0;
    }
    .composer textarea::placeholder{color:var(--slate-2);opacity:.7}
    .send{
      flex:none;width:42px;height:42px;border-radius:3px;border:none;
      background:var(--copper);color:var(--ink);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .2s,opacity .2s;
    }
    .send:hover:not(:disabled){background:var(--pine)}
    .send:disabled{opacity:.4;cursor:default}
    .disclaimer{
      max-width:780px;margin:0 auto;padding:0 28px 12px;
      font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;
      color:var(--slate-2);text-align:center;line-height:1.5;
    }
    @media(max-width:600px){
      .composer{padding:12px 18px 8px}
      .disclaimer{padding:0 18px 10px}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a class="hm" href="https://hollismountain.com" title="Back to Hollis Mountain">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M2 22 L9 8 L13 15 L17 4 L24 22 Z" stroke="#2d6a4f" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M9 8 L11 11 L13 9" stroke="#0f1614" stroke-width="1.2" stroke-linejoin="round" opacity=".55"/>
      </svg>
      <span class="wm">Hollis Mountain</span>
    </a>
    <span class="nav-div"></span>
    <span class="hc-ctx">
      <svg width="18" height="18" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M2 23 L8 11 L12 17 L17 6 L24 23 Z" stroke="#2d6a4f" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M17 6 L17 2 L22 3.5 L17 5 Z" fill="#2d6a4f" stroke="#2d6a4f" stroke-width="1" stroke-linejoin="round"/>
      </svg>
      <span class="nm">High Camp</span>
    </span>
  </div>
  <div class="nav-right">
    <a class="back" href="https://hollismountain.com"><span class="back-long">← Back to </span>Hollis Mountain</a>
  </div>
</nav>

<div class="thread" id="thread">
  <svg class="ridge" viewBox="0 0 1440 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 200 L0 120 L160 60 L320 110 L470 40 L640 100 L820 30 L1000 95 L1200 50 L1440 110 L1440 200 Z" fill="#e3eae4"/>
    <path d="M0 200 L0 150 L200 120 L420 150 L640 110 L880 150 L1120 120 L1440 150 L1440 200 Z" fill="#cfdad2"/>
  </svg>
  <div class="thread-inner" id="threadInner"></div>
</div>

<div class="composer-wrap">
  <div class="composer">
    <form id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Paste a job description, a title, or a few details…"
        autocomplete="off"
      ></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12 L19 12 M13 6 L19 12 L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>
  <div class="disclaimer">Conversations are logged and forwarded to Rob — please don't share confidential information.</div>
</div>

<script>
  (function () {
    const inner   = document.getElementById('threadInner');
    const thread  = document.getElementById('thread');
    const form    = document.getElementById('composer');
    const input   = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    const FLAG = '<svg width="18" height="18" viewBox="0 0 26 26" fill="none" aria-hidden="true">'
               + '<path d="M2 23 L8 11 L12 17 L17 6 L24 23 Z" stroke="#fafaf9" stroke-width="1.7" stroke-linejoin="round"/>'
               + '<path d="M17 6 L17 2 L22 3.5 L17 5 Z" fill="#fafaf9" stroke="#fafaf9" stroke-width="1" stroke-linejoin="round"/>'
               + '</svg>';

    const history = [];
    let busy = false;
    let suggestRemoved = false;

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function formatText(t) {
      return esc(t)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(?<!\w)\*([^\*\n]+?)\*(?!\w)/g, '<em>$1</em>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>')
        .replace(/^/, '<p>').replace(/$/, '</p>');
    }

    function scrollDown() {
      thread.scrollTop = thread.scrollHeight;
    }

    function enterAnim(el) {
      el.classList.add('enter');
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
      setTimeout(() => el.classList.remove('enter'), 140);
    }

    function userMsg(text) {
      const el = document.createElement('div');
      el.className = 'msg user';
      el.innerHTML =
        '<div class="avatar me"><span>YOU</span></div>'
        + '<div class="bubble"><div class="utext">' + esc(text) + '</div></div>';
      inner.appendChild(el);
      enterAnim(el);
      scrollDown();
    }

    function hcShell() {
      const el = document.createElement('div');
      el.className = 'msg hc';
      el.innerHTML =
        '<div class="avatar hc">' + FLAG + '</div>'
        + '<div class="bubble"><div class="who">High Camp</div><div class="body"></div></div>';
      inner.appendChild(el);
      enterAnim(el);
      return el;
    }

    function botMsg(text) {
      const el = hcShell();
      el.querySelector('.body').innerHTML = '<div class="atext">' + formatText(text) + '</div>';
      scrollDown();
      return el;
    }

    function typing() {
      // Bare typing row — no "HIGH CAMP" eyebrow, matches the design intent.
      const el = document.createElement('div');
      el.className = 'msg hc';
      el.innerHTML =
        '<div class="avatar hc">' + FLAG + '</div>'
        + '<div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
      inner.appendChild(el);
      enterAnim(el);
      scrollDown();
      return el;
    }

    function removeSuggestionsOnFirstSend() {
      if (suggestRemoved) return;
      const sug = inner.querySelector('.suggest');
      if (sug) sug.remove();
      suggestRemoved = true;
    }

    async function submit(text) {
      text = (text || '').trim();
      if (!text || busy) return;
      removeSuggestionsOnFirstSend();
      busy = true;
      updateSend();
      userMsg(text);
      history.push({ role: 'user', content: text });
      input.value = '';
      autosize();

      const typingEl = typing();
      try {
        const res = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history.slice(-40) }),
        });
        const data = await res.json();
        typingEl.remove();
        if (data.error) {
          botMsg('Error: ' + data.error);
        } else {
          history.push({ role: 'assistant', content: data.content });
          botMsg(data.content);
        }
      } catch {
        typingEl.remove();
        botMsg('Network error — please check your connection.');
      }
      busy = false;
      updateSend();
      input.focus();
    }

    function autosize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    }
    function updateSend() {
      sendBtn.disabled = busy || !input.value.trim();
    }

    input.addEventListener('input', () => { autosize(); updateSend(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(input.value); }
    });
    form.addEventListener('submit', e => { e.preventDefault(); submit(input.value); });

    // Initial greeting
    (async () => {
      await new Promise(r => setTimeout(r, 250));
      const greeting = "Hi — I'm High Camp, a career intelligence tool built on Rob McKinney's full professional background.\n\nShare the role you're exploring — a job description, a title, or just a few details — and I'll give you an honest picture of how Rob's experience maps to what you're looking for.";
      history.push({ role: 'assistant', content: greeting });
      const el = hcShell();
      const body = el.querySelector('.body');
      const chips = [
        "We're hiring a CPO at an early-stage startup",
        'How deep is his hands-on GenAI experience?',
        'Tell me about his leadership style',
        'How was this widget built?',
      ];
      let html = '<div class="atext">' + formatText(greeting) + '</div>';
      html += '<div class="suggest">';
      chips.forEach(c => { html += '<button class="schip" type="button">' + esc(c) + '</button>'; });
      html += '</div>';
      body.innerHTML = html;
      body.querySelectorAll('.schip').forEach(chip => {
        chip.addEventListener('click', () => submit(chip.textContent));
      });
      scrollDown();
      input.focus();
    })();
  })();
</script>

</body>
</html>
